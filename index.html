<script>

(function(){

  const params =
    new URLSearchParams(
      location.search
    );


  const query =
    params.toString();


  location.replace(

    'daily.html'

    +

    (
      query
        ?
        '?'
        +
        query
        :
        ''
    )

  );

})();

</script>
